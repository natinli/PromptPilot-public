<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PromptPilot</title>
    <!-- 主题初始化：在 DOM 解析阶段同步设置，完全消除白色闪烁 -->
    <script>
      (function() {
        try {
          var s = localStorage.getItem('promptpilot_settings');
          var parsed = s ? JSON.parse(s) : {};
          var t = parsed.theme || 'light';
          var micaEnabled = parsed.micaEnabled === true; // 默认禁用
var micaOpacity = typeof parsed.micaOpacity === 'number' ? parsed.micaOpacity : 25;
          var isDark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var style = document.createElement('style');
          if (isDark) {
            document.documentElement.classList.add('dark');
            // 暗色模式不使用 Mica，注入不透明背景色避免白色闪烁
            style.textContent = 'html.dark, html.dark body { background-color: oklch(0.25 0.006 270) !important; }';
          } else if (micaEnabled) {
            // 浅色模式 + Mica 启用：根据透明度设置背景
            var alpha = micaOpacity / 100;
            if (alpha <= 0) {
              style.textContent = 'html, body { background: transparent !important; }';
            } else {
              style.textContent = 'html, body { background: rgba(255,255,255,' + alpha + ') !important; }';
            }
          } else {
            // 浅色模式 + Mica 禁用：不透明白色背景
            style.textContent = 'html, body { background: oklch(1 0 0) !important; }';
          }
          document.head.appendChild(style);
        } catch(e) { /* 默认亮色模式，无需添加 dark 类 */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 全局错误捕获 —— 如果 JS 报错导致白屏，显示错误信息
      window.addEventListener('error', function(e) {
        var root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          root.innerHTML = '<div style="padding:40px;font-family:monospace;color:#e55;font-size:14px;">' +
            '<h2 style="color:#333;">⚠ JS 加载错误</h2>' +
            '<pre style="white-space:pre-wrap;background:#f5f5f5;padding:16px;border-radius:8px;margin-top:12px;">' +
            e.message + '\n' + (e.filename || '') + ':' + (e.lineno || '') +
            '</pre></div>';
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        console.error('[PromptPilot] Unhandled rejection:', e.reason);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
